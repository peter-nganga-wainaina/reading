name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to commit newly fetched covers back to main
  pages: write
  id-token: write

# Let a newer push replace a deploy that's still queued, but never cancel one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned to the version used locally, so the live site builds exactly like `zola serve`.
  ZOLA_VERSION: 0.23.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the importer and cover fetcher
        run: python3 -m unittest discover -s importer

      # Never fails the build: books Open Library can't help with keep their title block.
      - name: Fetch covers for new books
        run: python3 importer/covers.py content/books static/covers

      # Pushes made with the workflow's own token don't trigger another run, so this can't loop.
      # If main moved on meanwhile the push is refused; this build still has the covers, and the
      # next run fetches them again.
      - name: Commit new covers
        run: |
          if [ -n "$(git status --porcelain content static)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content static
            git commit -m "Add covers for new books"
            git push || echo "::warning::Couldn't push the new covers; the next run will fetch them again."
          fi

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build
        run: zola build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
